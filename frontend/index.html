<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <!-- Responsive viewport -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- App Title -->
  <title>AuditPay - Transaction System</title>

  <!-- Theme color for mobile browsers -->
  <meta name="theme-color" content="#4f46e5" />

  <!-- Tailwind CSS (CDN for simplicity & assignment compatibility) -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />

  <!-- Global styles (NO visual change) -->
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #f8fafc;
    }
  </style>

  <!-- Import maps for ESM-based setup -->
  <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@^19.2.3",
        "react/": "https://esm.sh/react@^19.2.3/",
        "react-dom": "https://esm.sh/react-dom@^19.2.3",
        "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
        "react-router-dom": "https://esm.sh/react-router-dom@^7.11.0",
        "lucide-react": "https://esm.sh/lucide-react@^0.562.0",
        "axios": "https://esm.sh/axios@^1.13.2"
      }
    }
  </script>
</head>

<body>
  <!-- React root -->
  <div id="root"></div>

  <!-- App entry -->
  <script type="module" src="/src/main.jsx"></script>

</body>
</html>
